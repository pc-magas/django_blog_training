name: blog-dev
services:
  mailer:
    image: axllent/mailpit
    ports:
      - 8025:8025
    networks:
      - dev
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    restart: on-failure

  django:
    build:
      context: .
      target: dev
    working_dir: /app/src
    environment:
      UV_PROJECT_ENVIRONMENT: /opt/venv
    command: uv run --frozen python -m debugpy --listen 0.0.0.0:5678 manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - ./db_dir:/db_dir
    ports:
      - "8000:8000"
      - "5678:5678"
    depends_on:
      - mailer
    networks:
      - dev

networks:
  dev: