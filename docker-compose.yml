services:
  mailer:
    image: axllent/mailpit
    ports:
      - 8025:8025
    networks:
      - dev
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    restart: on-failure

  django:
    build:
      context: .
      target: dev
    command: uv run --frozen python -m debugpy --listen 0.0.0.0:5678 manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
      - "5678:5678"
    depends_on:
      - mailer
    networks:
      - dev

  # A test building and running the final production image.
  django-testprod:
    build:
      context: .
      target: prod
    volumes:
      - db_dir:/db_dir
    ports:
      - "8000:8001"
    depends_on:
      - mailer
    networks:
      - dev

networks:
  dev:

volumes:
  db_dir: