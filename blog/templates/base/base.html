<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}My Website{% endblock %}</title>

  <style>
    /* TODO: Split into SASS and build CSS */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    /* Header */
    header {
      height: 70px;
      background: #222;
      color: white;
      display: flex;
      align-items: center;
      padding: 0 40px;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    /* Page layout */
    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;

      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 40px;
    }

    /* Articles */
    main {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .article {
      background: white;
      border: 1px solid #ddd;
      padding: 24px;
    }

    .article h2 {
      margin: 0 0 10px;
      font-size: 22px;
    }

    .article h2 a {
      color: #222;
      text-decoration: none;
    }

    .article h2 a:hover {
      text-decoration: underline;
    }

    .article-meta {
      color: #777;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .article p {
      margin: 0 0 15px;
      line-height: 1.6;
      color: #555;
    }

    .read-more {
      color: #0066cc;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
    }

    /* Sidebar */
    .sidebar {
      background: white;
      border: 1px solid #ddd;
      padding: 24px;
      align-self: start;
    }

    .sidebar h2 {
      margin: 0 0 20px;
      font-size: 18px;
    }

    .categories {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .categories li {
      border-bottom: 1px solid #eee;
    }

    .categories li:last-child {
      border-bottom: none;
    }

    .categories a {
      display: block;
      padding: 10px 0;
      color: #333;
      text-decoration: none;
    }

    .categories a:hover {
      color: #0066cc;
    }

    /* Mobile */
    @media (max-width: 700px) {
      .container {
        grid-template-columns: 1fr;
      }

      .sidebar {
        order: -1;
      }
    }
  </style>
  {% block extrastyles %}
  {% endblock %}

  {% block headerscripts %}
  {% endblock %}
</head>

<body>

  <header>
    <h1>My Articles</h1>
  </header>

  <div class="container">
    <main>
      {% block content %}
      {% endblock %}
    </main>


    <!-- Right sidebar -->
    {% block sidebar %}
      {% load widgets.categories_widget %}
      {% categories_widget %}
    {% endblock %}
  </div>

</body>
</html>
