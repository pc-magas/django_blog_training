[project]
name = "app"
version = "0.1.0"
description = "A simple blog"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asgiref==3.12.1",
    "bleach==5.0.1",
    "django==5.2.17",
    "django-injector==0.3.1",
    "injector==0.24.0",
    "six==1.17.0",
    "sqlparse==0.6.0",
    "tinycss2==1.1.1",
    "typing-extensions==4.16.0",
    "webencodings==0.6.1",
    "gunicorn",
    "psycopg[binary]>=3.3.6",
]

[tool.uv]
package = false
default-groups = ["dev"]

[dependency-groups]
dev = ["pytest","debugpy"]

