name: blog-testprod
services:

  mailer:
    image: axllent/mailpit
    ports:
      - 8026:8025
    networks:
      dev:
        ipv4_address: ${NGINX_IP}
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    restart: on-failure


  postgresql:
    image: postgres:17
    environment:
      POSTGRES_DB: blog
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog
    volumes:
      - ./volumes/pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"   # optional: only needed to connect from the host
    networks:
      dev:
        ipv4_address: ${POSTGRES_IP}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog -d blog"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: on-failure    

  # A test building and running the final production image.
  django-testprod:
    build:
      context: .
      target: prod
    environment:
      DB_PASSWORD: blog
    volumes:
      - static:/static
    expose:
      - "8000"
    depends_on:
      - mailer
    networks:
      - dev
  
  nginx:
    image: nginx:stable-alpine
    ports:
      - "8001:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/static
    depends_on:
      - django-testprod
    networks:
      - dev
    restart: on-failure

volumes:
  static:

networks:
  dev:
    ipam:
      config:
        - subnet: ${NET_IP}.0/24
          gateway: ${NET_IP}.1
          ip_range: ${NET_IP}.128/25